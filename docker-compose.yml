services:
  node1:
    build: .
    command: >
      --node-id 1 --port 6001 --repl-port 7001
      --peers 2@node2:7002,3@node3:7003 --data /data
    ports: ["6001:6001"]
    volumes: ["./data1:/data"]

  node2:
    build: .
    command: >
      --node-id 2 --port 6002 --repl-port 7002
      --peers 1@node1:7001,3@node3:7003 --data /data
    ports: ["6002:6002"]
    volumes: ["./data2:/data"]

  node3:
    build: .
    command: >
      --node-id 3 --port 6003 --repl-port 7003
      --peers 1@node1:7001,2@node2:7002 --data /data
    ports: ["6003:6003"]
    volumes: ["./data3:/data"]
